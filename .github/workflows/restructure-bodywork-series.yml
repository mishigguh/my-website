name: Restructure bodywork series landing

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/restructure-bodywork-series.yml

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0
      - name: Restructure bodywork landing
        run: python .github/scripts/restructure_bodywork_series.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bodywork.html
          git rm -- .github/scripts/restructure_bodywork_series.py .github/workflows/restructure-bodywork-series.yml
          git commit -m "Make four-session series the primary bodywork offer"
          git push origin HEAD:seo-chatgpt-discovery-foundation
