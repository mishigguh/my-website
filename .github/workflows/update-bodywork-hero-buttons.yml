name: Update bodywork hero buttons

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/update-bodywork-hero-buttons.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0
      - name: Update hero buttons
        run: python .github/scripts/update_bodywork_hero_buttons.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bodywork.html
          git rm -- .github/scripts/update_bodywork_hero_buttons.py .github/workflows/update-bodywork-hero-buttons.yml
          git commit -m "Update bodywork hero buttons"
          git push origin HEAD:seo-chatgpt-discovery-foundation
