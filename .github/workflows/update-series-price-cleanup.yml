name: Update series price and cleanup

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/update-series-price-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0
      - name: Update bodywork pricing and cleanup
        run: python .github/scripts/update_series_price_cleanup.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bodywork.html
          git rm -- .github/workflows/update-series-price-cleanup.yml .github/scripts/update_series_price_cleanup.py
          git commit -m "Update bodywork series pricing and simplify fallback"
          git push origin HEAD:seo-chatgpt-discovery-foundation
