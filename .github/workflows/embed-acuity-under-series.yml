name: Move Acuity embed under series

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/embed-acuity-under-series.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0
      - name: Move embedded scheduler under series
        run: python .github/scripts/embed_acuity_under_series.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bodywork.html
          git rm -- .github/scripts/embed_acuity_under_series.py .github/workflows/embed-acuity-under-series.yml
          git commit -m "Place Acuity scheduler directly under series offer"
          git push origin HEAD:seo-chatgpt-discovery-foundation
