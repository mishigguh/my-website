name: Set Intensive Acuity link

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/set-intensive-acuity.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0

      - name: Update only Intensive booking URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('bodywork.html')
          text = path.read_text(encoding='utf-8')

          old_iframe = '<iframe allow="payment" frameborder="0" height="900" id="acuity-scheduler" loading="lazy" src="https://movementandbodywork.as.me/bodywork" title="Book bodywork and movement" width="100%"></iframe>'
          new_iframe = '<iframe allow="payment" frameborder="0" height="900" id="acuity-scheduler" loading="lazy" src="https://movementandbodywork.as.me/?appointmentType=97616493" title="Book bodywork and movement" width="100%"></iframe>'

          old_fallback = '<a class="btn btn-secondary" href="https://movementandbodywork.as.me/bodywork" rel="noopener" target="_blank">Open Secure Booking</a>'
          new_fallback = '<a class="btn btn-secondary" href="https://movementandbodywork.as.me/?appointmentType=97616493" rel="noopener" target="_blank">Open Secure Booking</a>'

          if text.count(old_iframe) != 1:
              raise SystemExit(f'Expected exactly 1 Intensive iframe match, found {text.count(old_iframe)}')
          if text.count(old_fallback) != 1:
              raise SystemExit(f'Expected exactly 1 Intensive fallback match, found {text.count(old_fallback)}')

          text = text.replace(old_iframe, new_iframe, 1)
          text = text.replace(old_fallback, new_fallback, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/set-intensive-acuity.yml

      - name: Commit surgical booking-link change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bodywork.html .github/workflows/set-intensive-acuity.yml
          git diff --cached --check
          git commit -m "Point Intensive booking to dedicated Acuity type"
          git push origin HEAD:seo-chatgpt-discovery-foundation
