name: One-time offer cleanup

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/offer-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0
      - name: Update offers and retire stale sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 exact match, found {count}")
              return text.replace(old, new, 1)

          def must_sub(text, pattern, repl, label, flags=0):
              out, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, found {count}")
              return out

          # HOME: remove the paused Intensive from public routing and schema.
          p = Path('index.html')
          t = p.read_text()
          t = t.replace('      <a href="intensive.html">Intensive</a>\n', '')
          t = t.replace('      <a href="intensive.html">Intensive</a>\n', '')
          t = must_sub(
              t,
              r',\n\s*\{\n\s*"@type": "Service",\n\s*"@id": "https://mishalantsov\.com/intensive#service".*?\n\s*\}\n(?=\s*\]\n)',
              '\n',
              'homepage intensive schema',
              re.S,
          )
          p.write_text(t)

          # WRITING: remove Intensive navigation while the offer is paused.
          p = Path('writing.html')
          t = p.read_text().replace('      <a href="/intensive">Intensive</a>\n', '')
          t = t.replace('<a href="/intensive">Intensive</a>', '')
          p.write_text(t)

          # ESSAYS: remove Intensive navigation where present.
          for name in ['rethinking-posture.html', 'beyond-exercise.html']:
              p = Path(name)
              t = p.read_text().replace('      <a href="/intensive">Intensive</a>\n', '')
              p.write_text(t)

          # SITEMAP: remove paused Intensive.
          p = Path('sitemap.xml')
          t = p.read_text().replace('  <url><loc>https://mishalantsov.com/intensive</loc></url>\n', '')
          p.write_text(t)

          # Keep old /intensive links useful without presenting the retired offer.
          Path('intensive.html').write_text('''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Bodywork & Movement | Misha Lantsov</title>
            <meta name="robots" content="noindex,follow">
            <link rel="canonical" href="https://mishalantsov.com/bodywork">
            <meta http-equiv="refresh" content="0;url=/bodywork">
          </head>
          <body><p>This offer is currently paused. <a href="/bodywork">Continue to Bodywork & Movement.</a></p></body>
          </html>
          ''')

          # BODYWORK: make the recommended first transaction a four-session process.
          p = Path('bodywork.html')
          t = p.read_text()
          t = must_replace(
              t,
              '<a class="btn btn-primary" href="https://movementandbodywork.as.me/bodywork" target="_blank" rel="noopener">Book a Session</a>',
              '<a class="btn btn-primary" href="#starter">See How to Start</a>',
              'bodywork hero CTA',
          )

          old_outcome = '''      <div class="section-cta">
        <p>If this is the kind of shift you're looking for, start with a 75-minute session.</p>
        <div class="actions" style="margin-top:0;">
          <a class="btn btn-primary" href="https://movementandbodywork.as.me/bodywork" target="_blank" rel="noopener">Book 75 Minutes</a>
        </div>
      </div>'''
          new_outcome = '''      <div class="section-cta">
        <p>If this is the kind of shift you're looking for, I recommend starting with four sessions so we can see what changes, what returns, and what is useful between visits.</p>
        <div class="actions" style="margin-top:0;">
          <a class="btn btn-primary" href="#starter">See the 4-Session Start</a>
        </div>
      </div>'''
          t = must_replace(t, old_outcome, new_outcome, 'bodywork outcome CTA')

          starter = '''  <!-- STARTER & SESSIONS -->
  <section id="starter" class="section-line">
    <div class="wrap reveal">
      <span class="eyebrow">Recommended starting point</span>
      <h2>Start with four sessions, not just one.</h2>
      <p class="section-note">One session can create relief. Four gives us enough contact to learn what changes, what returns, and how hands-on work and movement fit together for your specific case.</p>

      <div class="sessions" style="grid-template-columns:1fr; max-width:760px;">
        <article class="session-card recommended">
          <div class="session-label">4-Session Starter Process</div>
          <div class="price">$435</div>
          <span class="price-note">Recommended for new clients</span>
          <p><strong>Three 75-minute bodywork sessions</strong> give us time to work hands-on, reassess between visits, and follow the patterns that actually matter.</p>
          <p><strong>One individualized movement-practice session</strong> is focused on movement patterns relevant to your case — closer to personal training than a group class.</p>
          <p>During the first or second visit, I will also teach you a simple therapy-ball self-release routine. You will leave with the routine and a link to the exact balls I use so you can work with it between sessions.</p>
          <div class="actions" style="margin-top:1rem;">
            <a class="btn btn-primary" href="https://movementandbodywork.as.me/bodywork" target="_blank" rel="noopener">Book the First Session</a>
          </div>
        </article>
      </div>

      <div style="margin-top:2.5rem;">
        <span class="eyebrow">Single sessions</span>
        <h3>Prefer one appointment first?</h3>
        <p class="section-note">Individual sessions are still available. For most new clients, 75 minutes gives us enough time to understand what is happening and begin useful work.</p>
      </div>
      <div class="sessions">
        <article class="session-card">
          <div class="session-label">60 Minutes</div>
          <div class="price">$125</div>
          <p>Focused work for one primary area or a general reset when you know what needs attention.</p>
          <div class="actions" style="margin-top:1rem;"><a class="btn btn-secondary" href="https://movementandbodywork.as.me/bodywork" target="_blank" rel="noopener">Book 60</a></div>
        </article>
        <article class="session-card">
          <div class="session-label">75 Minutes</div>
          <div class="price">$145</div>
          <p>More time to work with the pattern, sense what's happening, and begin integrating the change.</p>
          <div class="actions" style="margin-top:1rem;"><a class="btn btn-secondary" href="https://movementandbodywork.as.me/bodywork" target="_blank" rel="noopener">Book 75</a></div>
        </article>
        <article class="session-card">
          <div class="session-label">90 Minutes</div>
          <div class="price">$165</div>
          <p>For deeper work, complex tension patterns, or a fuller body session with time to go slow.</p>
          <div class="actions" style="margin-top:1rem;"><a class="btn btn-secondary" href="https://movementandbodywork.as.me/bodywork" target="_blank" rel="noopener">Book 90</a></div>
        </article>
      </div>
    </div>
  </section>

'''
          t = must_sub(
              t,
              r'  <!-- SESSIONS & PRICING -->\n.*?(?=  <!-- EXPERIENCE -->)',
              starter,
              'bodywork sessions section',
              re.S,
          )

          crossover = '''  <!-- DMS CROSSOVER -->
  <section class="crossover">
    <div class="wrap crossover-inner reveal">
      <div>
        <span class="eyebrow">Also at Denver Movement School</span>
        <h2>Bodywork and movement practice pair well.</h2>
        <p>Alongside bodywork, I teach a weekly Tuesday movement class in Denver built around strength, coordination, partner practice, movement skills, play, and physical challenge.</p>
        <p>Bodywork can give you better information about what your body holds. Movement practice gives that information somewhere to go.</p>
        <div class="actions">
          <a class="btn btn-clay" href="https://mishalantsov.com/denver-movement-school" target="_blank" rel="noopener">Visit Denver Movement School →</a>
        </div>
      </div>
    </div>
  </section>


'''
          t = must_sub(
              t,
              r'  <!-- DMS CROSSOVER -->\n.*?(?=  <!-- LOCATION -->)',
              crossover,
              'bodywork DMS crossover',
              re.S,
          )

          final_cta = '''  <!-- FINAL CTA -->
  <section class="final-cta">
    <div class="wrap">
      <span class="eyebrow">Start here</span>
      <h2>Begin with the four-session process.</h2>
      <p style="max-width:560px;">We'll use three bodywork sessions, one individualized movement-practice session, and a simple self-release routine to learn what helps and give you useful ways to keep working between visits.</p>
      <div class="actions">
        <a class="btn btn-clay" href="https://movementandbodywork.as.me/bodywork" target="_blank" rel="noopener">Book the First Session →</a>
      </div>
    </div>
  </section>

'''
          t = must_sub(
              t,
              r'  <!-- FINAL CTA -->\n.*?(?=</main>)',
              final_cta,
              'bodywork final CTA',
              re.S,
          )
          p.write_text(t)

          # DMS: keep the philosophy, imagery and recurring Tuesday class; remove stale offers.
          p = Path('denver-movement-school.html')
          t = p.read_text()
          t = must_replace(t, '    <li><a href="#cohort">Practice Cycle</a></li>\n', '', 'DMS practice-cycle nav')

          sprint_card = '''      <div class="class-card reveal">
        <div class="card-when">Monday and Thursday Morning · June–July</div>
        <div class="card-title">Sprint &amp;<br>Athletics</div>
        <div class="card-desc">Speed, power, elastic strength, conditioning, and the athletic foundations of movement practice. Small group training built around sprinting, breathing, recovery, and repeated exposure.</div>
        <div class="card-tags">
          <span class="tag">Early Morning</span>
          <span class="tag">Outdoors</span>
          <span class="tag">Ongoing</span>
        </div>
        <a class="btn btn-fill" href="https://movementandbodywork.as.me/sprint" target="_blank" rel="noopener">See the Tracks →</a>
      </div>'''
          t = must_replace(t, sprint_card, '', 'DMS sprint card')
          t = must_sub(t, r'<section class="cohort" id="cohort">.*?</section>\s*', '', 'DMS full practice cycle', re.S)
          t = must_sub(t, r'<!-- OPEN DAY -->\s*<section class="openday">.*?</section>\s*', '', 'DMS open movement day', re.S)
          t = t.replace('    grid-template-columns: 1fr 1fr;\n    gap: 1.5rem;\n    margin-top: 3rem;\n', '    grid-template-columns: minmax(0, 760px);\n    gap: 1.5rem;\n    margin-top: 3rem;\n', 1)
          t = must_sub(
              t,
              r'\n  // Cohort commitment bar\n  const cohortEl = document\.getElementById\(\'cohort\'\);.*?barObs\.observe\(cohortEl\);\n',
              '\n',
              'DMS cohort JS',
              re.S,
          )
          p.write_text(t)
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html writing.html rethinking-posture.html beyond-exercise.html sitemap.xml intensive.html bodywork.html denver-movement-school.html
          git rm -- .github/workflows/offer-cleanup.yml
          git commit -m "Clarify starter offer and retire stale offers"
          git push origin HEAD:seo-chatgpt-discovery-foundation
