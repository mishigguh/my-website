name: One-time offer cleanup

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/offer-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0

      - name: Update offers and retire stale sections
        run: python .github/scripts/offer_cleanup.py

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html writing.html rethinking-posture.html beyond-exercise.html sitemap.xml intensive.html bodywork.html denver-movement-school.html
          git rm -- .github/workflows/offer-cleanup.yml .github/scripts/offer_cleanup.py
          git commit -m "Clarify starter offer and retire stale offers"
          git push origin HEAD:seo-chatgpt-discovery-foundation
