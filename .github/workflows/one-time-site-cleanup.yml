name: One-time site cleanup

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/one-time-site-cleanup.yml

permissions:
  contents: write

jobs:
  patch-large-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0

      - name: Patch bodywork and DMS metadata
        run: python .github/scripts/one_time_cleanup.py

      - name: Commit patched pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bodywork.html denver-movement-school.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Finish landing-page metadata and factual cleanup"
            git push origin HEAD:seo-chatgpt-discovery-foundation
          fi
