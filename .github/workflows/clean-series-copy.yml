name: Clean series copy

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/clean-series-copy.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0
      - name: Clean copy
        run: python .github/scripts/clean_series_copy.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bodywork.html
          git rm -- .github/scripts/clean_series_copy.py .github/workflows/clean-series-copy.yml
          git commit -m "Polish four-session series copy"
          git push origin HEAD:seo-chatgpt-discovery-foundation
