name: Apply homepage images v2

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/apply-homepage-images-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0
      - name: Apply only supplied homepage images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          cat .github/tmp/treatw.00 .github/tmp/treatw.01 | base64 -d > images/treatment-room.webp
          cat .github/tmp/dmsw.00 .github/tmp/dmsw.01 .github/tmp/dmsw.02 | base64 -d > images/dms-jump.webp
          echo 'ef33dd9f0ca4727b64b42fb38191eab54e0124f3024bed3186df74cd246b8787  images/treatment-room.webp' | sha256sum -c -
          echo 'a335399c06bb8848b629a668168dbd134d9400c139bef2f821aed2c7dfacb267  images/dms-jump.webp' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path

          css_path = Path('home.css')
          css = css_path.read_text(encoding='utf-8')
          replacements = [
              ("background-image: url('images/partnerbodywork.jpeg');", "background-image: url('images/treatment-room.webp');"),
              ("background-image: url('images/sprint.png');", "background-image: url('images/dms-jump.webp');"),
          ]
          for old, new in replacements:
              if css.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old}')
              css = css.replace(old, new, 1)
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          old = 'home.css?v=20260826d'
          new = 'home.css?v=20260827-images'
          if html.count(old) != 1:
              raise SystemExit('Expected exactly one homepage stylesheet cache string')
          index_path.write_text(html.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/tmp/treatment-room.b64 .github/tmp/dms-jump.b64
          rm -f .github/tmp/treatw.00 .github/tmp/treatw.01
          rm -f .github/tmp/dmsw.00 .github/tmp/dmsw.01 .github/tmp/dmsw.02
          rm -f .github/workflows/apply-homepage-images.yml
          rm -f .github/workflows/apply-homepage-images-v2.yml
          rmdir .github/tmp 2>/dev/null || true
      - name: Commit image update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.css index.html images/treatment-room.webp images/dms-jump.webp
          git add -u .github
          git diff --cached --check
          git commit -m "Use supplied homepage portal images"
          git push origin HEAD:seo-chatgpt-discovery-foundation
