name: Apply homepage images

on:
  push:
    branches:
      - seo-chatgpt-discovery-foundation
    paths:
      - .github/workflows/apply-homepage-images.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-chatgpt-discovery-foundation
          fetch-depth: 0
      - name: Decode images and update homepage references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          base64 -d .github/tmp/treatment-room.b64 > images/treatment-room.jpg
          base64 -d .github/tmp/dms-jump.b64 > images/dms-jump.jpg
          python - <<'PY'
          from pathlib import Path

          css_path = Path('home.css')
          css = css_path.read_text(encoding='utf-8')
          old_body = "background-image: url('images/partnerbodywork.jpeg');"
          new_body = "background-image: url('images/treatment-room.jpg');"
          old_dms = "background-image: url('images/sprint.png');"
          new_dms = "background-image: url('images/dms-jump.jpg');"
          if old_body not in css:
              raise SystemExit('Expected bodywork background reference not found')
          if old_dms not in css:
              raise SystemExit('Expected DMS background reference not found')
          css = css.replace(old_body, new_body, 1).replace(old_dms, new_dms, 1)
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          old_ver = 'home.css?v=20260826d'
          new_ver = 'home.css?v=20260827-images'
          if old_ver not in html:
              raise SystemExit('Expected homepage stylesheet version not found')
          html = html.replace(old_ver, new_ver, 1)
          index_path.write_text(html, encoding='utf-8')
          PY
          rm -f .github/tmp/treatment-room.b64 .github/tmp/dms-jump.b64
          rm -f .github/workflows/apply-homepage-images.yml
      - name: Commit image update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home.css index.html images/treatment-room.jpg images/dms-jump.jpg .github/tmp .github/workflows/apply-homepage-images.yml
          git commit -m "Use supplied homepage portal images"
          git push origin HEAD:seo-chatgpt-discovery-foundation
