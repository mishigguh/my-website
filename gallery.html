    .gallery-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1rem; }

  <nav class="site-nav" aria-label="Primary navigation">

  <main>
    <section><div class="wrap narrow"><span class="eyebrow">Gallery</span><h1>Movement & bodywork in practice.</h1><p class="lead">Photos from movement practice, classes, sprinting, partner work, and hands-on bodywork.</p></div></section>

  <footer class="site-footer"><span>© 2026 Misha Lantsov</span><div class="footer-links"><a href="/">Home</a><a href="/about">About</a><a href="/writing">Writing</a><a href="/contact">Contact</a></div></footer>
